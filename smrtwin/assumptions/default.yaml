# =============================================================================
#  SMR vs gas digital twin — default assumptions
#  Money: real PLN, 2026 price level, unless stated.  FX (NBP 18 Sep 2026):
#  EUR/PLN 4.3633, USD/PLN 3.7998, CAD/PLN 2.7143.
#  Every block carries a `source:` note; full citations in docs/ASSUMPTIONS.md.
#  Values with three entries are [low, central, high] "cases".
# =============================================================================

meta:
  base_year: 2026
  currency: PLN
  eur_pln: 4.3633
  usd_pln: 3.7998
  hours_per_year: 8760

macro:
  cpi_long_run: 0.025               # NBP target; used only for nominal outputs
  # Real post-tax WACC.  PEJ EC decision Table 1: nominal 6–8 % with aid (CfD),
  # 8.5–10.5 % merchant; deflated at 2.5 % CPI. Ministry of Climate LCOE note: 7 % real for CCGT.
  wacc_real:
    smr_cfd:      [0.040, 0.050, 0.065]
    smr_merchant: [0.060, 0.070, 0.085]
    gas:          [0.060, 0.070, 0.085]
  social_discount_rate: 0.05        # for system-cost view (knowledge pack convention)

market:
  # --- Reference historical year for the hourly price shape ------------------
  reference_window: last12m          # last12m | cal2025 | cal2024 | cal2023
  # --- Annual mean day-ahead price path, real 2026 PLN/MWh --------------------
  # 2027–2029: TGE BASE_Y forwards, Aug-2026 monthly VWAP (RAPORT_2026_08): 495.5 / 444.5 / 420.1
  # (mid-Sept 2026 the front spiked to ~590 on gas; forward snapshot is volatile).
  # 2030+: judgement bridging TGE 2029 and PEJ counterfactual; see ASSUMPTIONS.md.
  price_path:
    anchor_years: [2027, 2028, 2029, 2030, 2035, 2040, 2050, 2100]
    low:          [440,  380,  350,  320,  300,  290,  280,  280]
    central:      [496,  445,  420,  410,  400,  390,  380,  380]
    high:         [590,  520,  480,  470,  480,  500,  520,  520]
  # --- Optional market-consistency link: annual mean = multiplier × CCGT SRMC(gas, EUA) ----
  # Calibration: 2025 TGE mean 446 vs CCGT-60 % SRMC 427 (×1.04); Aug 2026 584 vs 604 (×0.97).
  # Off in the base case (the path above assumes gas sets the price in fewer hours as RES+storage grow).
  srmc_link:
    enabled: false
    multiplier: [0.85, 0.95, 1.05]
    eta: 0.60
    vom_pln_per_mwh: 15
  # --- Shape evolution: solar cannibalisation -------------------------------
  # Midday (09–16) price depression grows; negative hours 186 (2024) → ~315 (2025).
  # cannibalisation_growth = extra fractional midday depression per year vs reference year
  cannibalisation:
    enabled: true
    growth_per_year: [0.005, 0.010, 0.015]     # low = slower RES growth
    max_extra_depression: 0.35
    negative_price_floor: -600                 # SDAC harmonised min (EUR) → not binding in PLN scale here
  # --- Gas (PL virtual point), real 2026 PLN/MWh_fuel ------------------------
  # 2027 TGE GAS_BASE_Y-27 Aug-2026 avg 214.20; forward proxy thereafter (TTF 38/33/31 EUR + 4 EUR premium)
  gas_price_path:
    anchor_years: [2026, 2027, 2028, 2029, 2030, 2040, 2100]
    low:          [230, 180, 130, 115, 110, 110, 110]
    central:      [265, 214, 165, 145, 135, 135, 135]
    high:         [300, 290, 200, 185, 175, 175, 175]
  # --- EUA, real 2026 EUR/t ---------------------------------------------------
  # 18 Sep 2026 spot 86.9; Reuters poll 2027 93; consensus 2030 126 (range 80–147)
  eua_path:
    anchor_years: [2026, 2027, 2030, 2035, 2040, 2100]
    low:          [80,  70,  80,  90,  90,  90]
    central:      [85,  90, 115, 140, 150, 150]
    high:         [90, 105, 145, 200, 220, 220]
  gas_emission_factor_t_per_mwh_fuel: 0.2006   # KOBiZE 55.73 kg/GJ (2025 ETS factor)
  # Monthly gas seasonality (TTF front-month 2024–2025 monthly averages, normalised to mean 1)
  gas_month_factor: [1.13, 1.08, 1.05, 0.95, 0.90, 0.94, 0.99, 0.93, 1.00, 0.96, 1.02, 1.06]
  # Fixed-price alternative for the SMR: "average spot over the last year" (last12m reference mean)
  fixed_price_source: reference_mean          # reference_mean | value
  fixed_price_value_pln_per_mwh: 483.4
  # --- Capacity market ------------------------------------------------------
  # 2030 main auction cleared 465.02 PLN/kW-yr (URE, Dec 2025); no auction for delivery ≥2031 exists.
  capacity_market:
    price_pln_per_kw_yr: [0, 0, 400]           # base case: NO successor mechanism assumed
    contract_years: 17
    kwd_nuclear: 0.9383
    kwd_ccgt: 0.9315
    kwd_ocgt: 0.9328
  # --- Balancing capacity (gas only) — treated as opportunity revenue --------
  balancing_pln_per_kw_yr:
    ccgt: [0, 15, 40]
    ocgt: [10, 40, 120]

# =============================================================================
smr:
  technology: "GE Vernova Hitachi BWRX-300"
  n_units: 1
  net_mw: 300.0                      # ARIS 270–290 net vs GE "up to 300"; closed-loop cooling penalty in low case
  thermal_mwt: 870.0
  net_mw_cases: [285.0, 300.0, 300.0]
  life_years: 60
  # --- Capital cost, all-in overnight (EPC + owner's + contingency + site share), PLN/kW, excl. IDC
  # low  = OSGE "~2 bn EUR/unit" (29,100) less; central = mid-fleet position (Stalowa Wola = OSGE site 3/4,
  #        fleet unit ≥7): 42,000 FOAK × 0.905^3 ≈ 31,000 + 15 % contingency + 2,500 site share ≈ 38,000;
  # high = Darlington unit-1 core excl. common/IDC ≈ 36,200 (2024 CAD) escalated + Polish FOAK premium + contingency ≈ 55,000
  capex_pln_per_kw: [28000, 38000, 55000]
  construction_years: [4, 5, 6]
  # Spend S-curve for 5-yr build (INL/TIMCAT-style); rescaled to construction_years
  spend_profile_5yr: [0.12, 0.24, 0.30, 0.22, 0.12]
  pre_development_mpln: [300, 500, 900]       # licensing, EIA, FEED, PAA fees (per site)
  first_core_mpln: [450, 550, 700]            # capitalised, 44 tU × ~3,300 USD/kgU
  grid_connection_mpln: [60, 125, 200]        # site proxy 150–400 m PLN for 4 units → per-unit share
  cod_year: 2035                              # Stalowa Wola is 3rd/4th OSGE site; transboundary EIA
  # --- Fixed O&M (staff, insurance, materials, contractors, regulatory), PLN/kW-yr
  # INL 2024 SMR Adv/Mod/Cons 448/517/821; EIA 471; Lazard 517–600. Single-unit phase multiplier ×1.5.
  fom_pln_per_kw_yr: [400, 520, 820]
  single_unit_fom_multiplier: [1.3, 1.5, 1.8]
  single_unit_years: 3                        # unit 1 operates alone before units 2–4 (site build-out)
  staff_fte_per_unit: [120, 180, 250]
  staff_cost_kpln_per_fte: [200, 290, 380]    # loaded (employer ZUS incl.)
  # --- Variable costs, PLN/MWh_e ----------------------------------------------
  fuel_pln_per_mwh: [23, 31, 40]              # own front-end build-up (U3O8 96.5 $/lb LT, SWU 183, conv 55.5, fab 350)
  vom_pln_per_mwh: [8, 11, 15]                # INL 2.2–2.8 $/MWh; EIA 3.23; Lazard 4.4–5.15
  decommissioning_fund_pln_per_mwh: [17.16, 26.0, 35.0]   # Dz.U. 2012 poz. 1213 statutory 17.16 (unindexed) / CPI-indexed / re-based
  sustaining_capex_pln_per_mwh: [15, 25, 40]  # NEI US fleet 8.8–13.6 $/MWh; MIT 6.25 — treated as fixed annual at rated CF
  # --- Availability -------------------------------------------------------------
  availability:
    refuel_cycle_months: 18
    refuel_outage_days: [12, 15, 20]
    major_inspection_days_per_10yr: 25
    forced_outage_rate: [0.02, 0.03, 0.05]    # EFOR; first 3 years add +0.03
    foak_first_years_extra_efor: 0.03
    outage_month: 4                            # planned outages in April (lowest historic prices)
  # --- Flexibility (GE General Description §3.2) ---------------------------------
  flexibility:
    min_load: 0.50
    ramp_pct_per_min_50_90: 0.5
    ramp_pct_per_min_90_100: 2.0
    # part-load: reactor power reduction (fuel banked, cost/MWh ~constant) + turbine off-design penalty
    efficiency_penalty_pts_at_50pct: 1.5       # PNNL-30225 / NEA 2011
    load_following_ucf_loss: [0.0, 0.012, 0.02] # NEA 2011 French fleet 1.2–2 % UCF
    load_following_fom_uplift: [0.0, 0.01, 0.02]
    cycling_cost_pln_per_mw_change: [0, 5, 20]  # proxy — no published EUR/MW-cycle for nuclear
    allow_shutdown: false                      # BWRX-300 dispatch keeps ≥50 %; no on/off cycling
  # --- Property tax (2 % of budowle value; post-2025 definitions) ---------------
  property_tax:
    rate: 0.02
    budowle_share_of_capex: [0.08, 0.20, 0.40]
    host_gmina_share: 0.50                     # art. 50 nuclear investment act: 50 % to bordering gminas
  # --- Tax depreciation split of CAPEX by KŚT group (straight-line %/yr) -----------
  depreciation_split:
    buildings_2_5pct: 0.20
    structures_4_5pct: 0.15
    reactor_14pct: 0.25
    turbine_bop_7pct: 0.30
    devices_10pct: 0.10
  # --- Revenue mechanisms ---------------------------------------------------------
  cfd:
    strike_eur_per_mwh: [115, 125, 135]        # user brief; OSGE public statements 125–145 (Oct 2025), fleet avg ~120
    tenor_years: 40                            # PEJ precedent (60 requested → 40 approved)
    reference: daily_base                      # hourly | daily_base  (PEJ: daily blended TGE index)
    exclude_negative_hours: false              # PEJ: no explicit exclusion; plant simply does not offer below variable cost
    two_way: true

# =============================================================================
gas:
  units:
    ccgt:
      label: "CCGT 1+1 F-class, ~300 MW"
      net_mw: 300.0
      capex_pln_per_kw: [4800, 6200, 8500]     # Polish 2025 EPC 4,800–5,500 for 560–1,340 MW +15–20 % scale penalty
      construction_years: [3, 4, 5]
      spend_profile: [0.30, 0.45, 0.25]
      life_years: 30
      eta_full_lhv: [0.55, 0.57, 0.60]
      eta_min_load_lhv: 0.45                   # −12 pts at 50 % load (academic example: 62→47)
      min_load: 0.40
      ramp_pct_per_min: 8
      min_up_hours: 4
      min_down_hours: 4
      start_cost_pln_per_mw: {hot: 150, warm: 240, cold: 350}   # Kumar/NREL 2012 €35/55/80 escalated
      start_hot_max_off_hours: 8
      start_warm_max_off_hours: 48
      start_fuel_mwh_per_mw: 1.2               # fuel burned during start (not sold)
      fom_pln_per_kw_yr: [70, 100, 130]        # incl. LTSA fixed fee (Dolna Odra LTSA ≈61 PLN/kW-yr)
      vom_pln_per_mwh: [12, 16, 22]
      gas_exit_tariff_pln_per_kw_yr: 58        # Gaz-System exit 0.381 gr/(kWh/h)/h, annual firm booking
      availability: [0.90, 0.925, 0.95]
      planned_outage_weeks: 3
      staff_fte: [45, 60, 80]
      staff_cost_kpln_per_fte: [150, 200, 260]
      budowle_share_of_capex: 0.15
      depreciation_split: {buildings_2_5pct: 0.15, structures_4_5pct: 0.10, turbine_bop_7pct: 0.60, devices_10pct: 0.15}
    ocgt:
      label: "OCGT frame peaker"
      net_mw: 150.0
      capex_pln_per_kw: [2000, 3400, 5800]
      construction_years: [2, 2, 3]
      spend_profile: [0.5, 0.5]
      life_years: 30
      eta_full_lhv: [0.36, 0.39, 0.43]
      eta_min_load_lhv: 0.28
      min_load: 0.30
      ramp_pct_per_min: 15
      min_up_hours: 1
      min_down_hours: 1
      start_cost_pln_per_mw: {hot: 100, warm: 100, cold: 100}
      start_hot_max_off_hours: 8
      start_warm_max_off_hours: 48
      start_fuel_mwh_per_mw: 0.3
      fom_pln_per_kw_yr: [30, 55, 85]
      vom_pln_per_mwh: [15, 20, 30]
      gas_exit_tariff_pln_per_kw_yr: 35        # monthly/daily products with multipliers, lower booked hours
      availability: [0.93, 0.95, 0.97]
      planned_outage_weeks: 1
      staff_fte: [10, 15, 20]
      staff_cost_kpln_per_fte: [150, 200, 260]
      budowle_share_of_capex: 0.12
      depreciation_split: {buildings_2_5pct: 0.10, structures_4_5pct: 0.10, turbine_bop_7pct: 0.65, devices_10pct: 0.15}
    engine:
      label: "Gas reciprocating engines (Wärtsilä 50DF/31SG class)"
      net_mw: 18.0
      capex_pln_per_kw: [2700, 3800, 5000]
      construction_years: [1, 2, 2]
      spend_profile: [0.5, 0.5]
      life_years: 25
      eta_full_lhv: [0.45, 0.48, 0.50]
      eta_min_load_lhv: 0.42
      min_load: 0.10
      ramp_pct_per_min: 100
      min_up_hours: 1
      min_down_hours: 1
      start_cost_pln_per_mw: {hot: 20, warm: 20, cold: 20}
      start_hot_max_off_hours: 8
      start_warm_max_off_hours: 48
      start_fuel_mwh_per_mw: 0.05
      fom_pln_per_kw_yr: [55, 75, 95]
      vom_pln_per_mwh: [25, 32, 40]
      gas_exit_tariff_pln_per_kw_yr: 35
      availability: [0.93, 0.95, 0.97]
      planned_outage_weeks: 1
      staff_fte: [10, 15, 20]
      staff_cost_kpln_per_fte: [150, 200, 260]
      budowle_share_of_capex: 0.12
      depreciation_split: {buildings_2_5pct: 0.10, structures_4_5pct: 0.10, turbine_bop_7pct: 0.65, devices_10pct: 0.15}
  cod_year: 2031                       # turbine lead times 3–5 yr; order 2027 → COD 2031
  gas_premium_over_hub_pln_per_mwh: [9, 17, 35]   # 2/4/8 EUR/MWh Polish premium (already in TGE path; applied to hub-based paths only)
  licence_fee_share_of_revenue: 0.005  # URE proposal from 2027: 0.5 % of revenue, uncapped (current 0.05 % cap 2.5 m)
  property_tax_rate: 0.02

# =============================================================================
tax:
  cit_rate: 0.19
  loss_carry_forward_years: 5
  loss_utilisation_cap: 0.50            # max 50 % of a given year's loss per year
  minimum_tax:
    enabled: false                       # art. 24ca — 10 % of base if profitability ≤2 %; exempt first 3 years; group shelter likely
    rate: 0.10
    base_share_of_revenue: 0.015
  depreciation_rates:                    # KŚT straight-line, %/yr
    buildings_2_5pct: 0.025
    structures_4_5pct: 0.045
    reactor_14pct: 0.14
    turbine_bop_7pct: 0.07
    devices_10pct: 0.10
  local_shares_2025_system:              # ustawa o dochodach JST (Dz.U. 2024 poz. 1572): % of taxpayers' INCOME
    pit_gmina: 0.070
    pit_powiat: 0.020
    pit_wojewodztwo: 0.0035
    cit_gmina: 0.016
    cit_powiat: 0.017
    cit_wojewodztwo: 0.023
  employee:
    zus_employee_share: 0.1371
    zus_employer_share: 0.2048
    pit_bracket_threshold_pln: 120000
    pit_rate_low: 0.12
    pit_rate_high: 0.32
    pit_free_amount_tax_pln: 3600
    health_contribution: 0.09
    resident_share_in_gmina: 0.60         # share of plant staff living in the host gmina (assumption)
  construction_local_pit:
    enabled: true
    peak_construction_workers_per_unit: 1500   # Darlington "2,500 workers" for 4 units; scaled
    avg_worker_gross_pln_per_month: 9000
    resident_share_in_gmina: 0.25
